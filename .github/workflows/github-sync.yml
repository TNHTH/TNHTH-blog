name: Sync public GitHub metadata

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:github
        env:
          PUBLIC_SITE_URL: https://example.invalid
      - name: Create snapshot pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/github-snapshot
          delete-branch: true
          title: "chore: refresh GitHub snapshot"
          commit-message: "chore: refresh GitHub snapshot"
          body: "Automated metadata snapshot from the configured public repository allowlist."
